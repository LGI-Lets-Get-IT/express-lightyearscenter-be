name: Deploy application
on:
  push:
    branches:
      - main
      - development

jobs:
  deploy-to-development:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT}}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            docker container rm -f lumecoffee_pos_api-dev || true
            docker image rm -f mrizalrizky/lumecoffee-pos-dev:latest || true
            docker run --name lumecoffee_pos_api-dev -d -p 3344:3344 mrizalrizky/lumecoffee-pos-dev:latest
