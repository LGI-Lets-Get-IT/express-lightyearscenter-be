name: Docker Image CI

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]
  workflow_call:

jobs:
  build_development_image:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .env file
      run: |
        echo "${{ secrets.ENV_DEVELOPMENT }}" > .env

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: mrizalrizky
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build the Docker image
      uses: docker/build-push-action@v3
      with:
        context: .
        push: true
        tags: mrizalrizky/lumecoffee-backend-dev:latest
        build-args: |
          ENV_FILE_PATH=.env
      # run: |
      #   docker build . 
    # - name: Publish docker image to Docker Hub
    #   run: |
    #     docker login -u mrizalrizky -p ${{ secrets.DOCKER_HUB_TOKEN }}
    #     docker push mrizalrizky/lume-pos-backend:latest
  build-production-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .env file
      run: |
        echo "${{ secrets.ENV_PRODUCTION }}" > .env

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: mrizalrizky
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build the Docker image
      uses: docker/build-push-action@v3
      with:
        context: .
        push: true
        tags: mrizalrizky/lumecoffee-backend:latest
        build-args: |
          ENV_FILE_PATH=.env
